name: ほうげんキーボード APK

on:
  push:
    branches: [main]
    paths: ["hogen/android/**", "hogen/dict.json", ".github/workflows/hogen-android.yml"]
  pull_request:
    paths: ["hogen/android/**", "hogen/dict.json", ".github/workflows/hogen-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: hogen/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk hogen-keyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hogen-keyboard-apk
          path: hogen/android/hogen-keyboard.apk
      # main に入ったら、誰でもダウンロードできる「hogen-latest」リリースのAPKを差し替える
      - name: Publish to hogen-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hogen-latest >/dev/null 2>&1 || \
            gh release create hogen-latest --title "ほうげんキーボード（最新版）" \
              --notes "ほうげん予測変換のAndroidキーボード試作版です。インストール後、アプリを開いてキーボードを有効にしてください。" --prerelease
          gh release upload hogen-latest hogen/android/hogen-keyboard.apk --clobber
